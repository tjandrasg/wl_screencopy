[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wl_screencopy"
version = "0.1.0"
description = "Wayland screen capture and recording (wlr-screencopy) exposed as NumPy RGB arrays"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "wl_screencopy contributors" }]
keywords = ["wayland", "screencopy", "screen-capture", "recording", "numpy",
            "wlroots", "grim", "wlr-screencopy-unstable-v1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Wayland",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
# Pillow makes save_image() work without ffmpeg.
images = ["Pillow"]
test = ["pytest>=7"]

[project.scripts]
wl-screencopy = "wl_screencopy.cli:main"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
wl_screencopy = ["_native/*.so*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
